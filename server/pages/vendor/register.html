<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Become a partner</title>
<meta name="theme-color" content="#c0682a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yala Safaris">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/customer.css">
<link rel="stylesheet" href="/assets/pwa.css">
<style>
main.wrap{padding:22px 16px 80px;max-width:760px}
.hero3{border-radius:20px;padding:24px;background:linear-gradient(120deg,#5b6b3a,#3f5a2e);color:#fff6e6;position:relative;overflow:hidden}
.hero3 h1{color:#fff6e6}.hero3 p{color:#e8dcc4;max-width:460px}
.hero3 .jp{position:absolute;right:-10px;bottom:-6px;opacity:.9;animation:idle 1.1s ease-in-out infinite alternate}
@keyframes idle{to{transform:translateY(-3px)}}
.perks{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:13px;font-weight:600}
.prog{display:flex;gap:6px;margin:20px 0 6px}.prog span{flex:1;height:6px;border-radius:99px;background:var(--sand);transition:background .3s}.prog span.on{background:var(--ochre)}
.stepl{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:12px}
.g2f{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){.g2f{grid-template-columns:1fr}}
.drop{border:2px dashed var(--line);border-radius:14px;padding:16px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;display:block;margin-bottom:10px}
.drop:hover{border-color:var(--ochre);background:color-mix(in srgb,var(--ochre) 6%,transparent)}
.drop.has{border-style:solid;border-color:var(--olive);background:var(--ok-bg);text-align:left}
.drop input{display:none}
.drop b{display:block}
.langs{display:flex;flex-wrap:wrap;gap:6px}
.langs button{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.langs button.on{background:var(--olive);color:#fff;border-color:var(--olive)}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.done{text-align:center;padding:40px 20px}
</style>
</head>
<body>
<main class="wrap" id="root"></main>

<script src="/api/config.js"></script>
<script src="/assets/core.js"></script>
<script src="/assets/customer.js"></script>
<script src="/assets/pages/partner-register.js"></script>
</body>
</html>
