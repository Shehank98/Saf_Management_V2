<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pick a date</title>
<meta name="theme-color" content="#c0682a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yala Safaris">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
<link rel="stylesheet" href="/assets/customer.css">
<link rel="stylesheet" href="/assets/pwa.css">
<style>
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calhead h3{font-size:20px}
.nav{display:flex;gap:6px}
.nav button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:18px}
.nav button:disabled{opacity:.35;cursor:not-allowed}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{min-width:0;overflow:hidden}
.dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.05em}
.day{min-height:66px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);padding:6px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s,border-color .15s}
.day:hover:not(:disabled){transform:translateY(-2px);border-color:var(--ochre)}
.day .n{font-weight:700;font-size:15px}
.day .s{font-size:10.5px;font-weight:700;line-height:1.2}
.day .jp{display:flex;gap:2px}.day .jp i{width:9px;height:6px;border-radius:2px;background:var(--olive)}
.day:disabled{opacity:.4;cursor:not-allowed;background:repeating-linear-gradient(45deg,var(--sand),var(--sand) 4px,var(--paper) 4px,var(--paper) 8px)}
.day.sel{border-color:var(--ochre);background:color-mix(in srgb,var(--ochre) 12%,var(--paper));box-shadow:0 0 0 3px color-mix(in srgb,var(--ochre) 25%,transparent)}
.s.ok{color:var(--ok)}.s.warn{color:var(--warn)}.s.bad{color:var(--bad)}
@media (max-width:560px){.day{min-height:54px;padding:4px}.day .s{font-size:9.5px}.cal{gap:4px}}
.seg{display:inline-flex;background:var(--sand);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
</style>
</head>
<body>
<main class="wrap shell">
  <div>
    <div class="head fade"><h1>Pick a date</h1><p>Each day shows how many private jeeps are still free for this session.</p></div>
    <div class="fade d1" style="margin-bottom:12px"><span class="small muted" style="margin-right:8px">Session:</span><div class="seg" id="sesSeg"></div></div>
    <div class="card fade d2">
      <div class="calhead"><h3 id="mon"></h3><div class="nav"><button id="prev" aria-label="Previous month">‹</button><button id="nxt" aria-label="Next month">›</button></div></div>
      <div class="cal" id="cal"></div>
      <p class="tiny muted" style="margin:12px 0 0">Green bars = jeeps free. Hatched days are closed or sold out.</p>
    </div>
    <div class="card fade d3" style="margin-top:14px" id="detail"></div>
  </div>
  <aside class="aside card" id="aside"></aside>
</main>

<script defer src="/api/config.js"></script>
<script defer src="/assets/core.js"></script>
<script defer src="/assets/customer.js"></script>
<script defer src="/assets/pages/02-date.js"></script>
</body>
</html>
