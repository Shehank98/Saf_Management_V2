<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My booking</title>
<meta name="theme-color" content="#c0682a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yala Safaris">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/customer.css">
<link rel="stylesheet" href="/assets/pwa.css">
<style>
main.wrap{padding:28px 16px 80px;max-width:820px}
.lookup{max-width:440px;margin:24px auto;text-align:center}
.lookup .card{text-align:left;margin-top:18px}
.trk{display:flex;margin:6px 0;overflow-x:auto;padding:4px 0}
.trk .s{flex:1;min-width:92px;text-align:center;position:relative;font-size:12px;font-weight:600;color:var(--muted)}
.trk .s .d{width:26px;height:26px;border-radius:50%;margin:0 auto 6px;background:var(--sand);border:3px solid var(--line);position:relative;z-index:1}
.trk .s::before{content:"";position:absolute;top:12px;left:-50%;width:100%;height:3px;background:var(--line)}
.trk .s:first-child::before{display:none}
.trk .s.done{color:var(--ok)}.trk .s.done .d{background:var(--olive);border-color:var(--olive)}.trk .s.done::before,.trk .s.now::before{background:var(--olive)}
.trk .s.now{color:var(--ink)}.trk .s.now .d{border-color:var(--ochre);box-shadow:0 0 0 5px color-mix(in srgb,var(--ochre) 22%,transparent)}
.trk .s.x .d{background:var(--bad);border-color:var(--bad)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kv div{font-size:12px;color:var(--muted)}.kv b{display:block;font-size:15px;color:var(--ink)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.modal{position:fixed;inset:0;z-index:90;background:rgba(20,12,4,.5);display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}.modal .card{max-width:440px;width:100%;animation:fade .25s ease}
.cntdn{display:flex;gap:8px}.cntdn div{background:var(--sand);border-radius:10px;padding:8px 10px;text-align:center;min-width:60px}.cntdn b{display:block;font-family:Fraunces,serif;font-size:22px}.cntdn span{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<main class="wrap" id="root"></main>
<div class="modal" id="modal"><div class="card" id="mb"></div></div>

<script src="/api/config.js"></script>
<script src="/assets/core.js"></script>
<script src="/assets/customer.js"></script>
<script src="/assets/pages/my-booking.js"></script>
</body>
</html>
