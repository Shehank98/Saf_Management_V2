<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Website text – Admin</title>
<meta name="theme-color" content="#2b2118">
<link rel="manifest" href="/admin.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
<link rel="stylesheet" href="/assets/admin.css">
<link rel="stylesheet" href="/assets/pwa.css">
<style>
/* preview on the left, editor on the right; each side scrolls on its own */
#content{max-width:none;padding-top:8px}
.cw{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(380px,.9fr);gap:16px;height:calc(100vh - var(--navh,64px) - 96px);min-height:520px}
.cpv,.ced{display:flex;flex-direction:column;min-width:0;min-height:0;border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.cbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
.cbar .sp{flex:1}
.cbar select{height:38px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:600 13.5px Inter,system-ui,sans-serif;padding:0 10px;min-width:0}
.dev{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}.dev button{border:0;background:var(--card);color:var(--muted);padding:0 12px;height:35px;font:700 13px Inter,system-ui,sans-serif}.dev button.on{background:var(--ink);color:var(--paper)}
.cstage{flex:1;min-height:0;display:grid;place-items:stretch center;background:color-mix(in srgb,var(--fg,#000) 5%,var(--paper));padding:10px;overflow:auto}
.cstage iframe{width:100%;height:100%;border:0;background:#fff;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.cstage.phone iframe{width:390px;max-width:100%}
.chint{padding:8px 14px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);background:var(--paper)}
.ctabs{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.ctabs button{border:1.5px solid var(--line);background:var(--card);color:var(--muted);border-radius:99px;padding:0 14px;height:38px;font:700 13.5px Inter,system-ui,sans-serif}.ctabs button.on{background:var(--ochre);border-color:var(--ochre);color:#fff}
.ctabs input{flex:1;min-width:130px;height:38px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--card);color:var(--ink);font:500 14px Inter,system-ui,sans-serif}
.cform{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 18px}
.cfield{padding:10px 0;border-bottom:1px dashed var(--line)}
.cfield:last-child{border-bottom:0}
.cfield label{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:13px;font-weight:700;margin-bottom:5px}
.cfield label small{font-weight:600;color:var(--muted);font-size:11.5px}
.cfield textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--paper);color:var(--ink);font:500 14.5px/1.45 Inter,system-ui,sans-serif;resize:vertical;min-height:42px}
.cfield textarea:focus{outline:none;border-color:var(--ochre);box-shadow:0 0 0 3px color-mix(in srgb,var(--ochre) 22%,transparent)}
.cfield.changed textarea{border-color:color-mix(in srgb,var(--ochre) 70%,var(--line));background:color-mix(in srgb,var(--ochre) 7%,var(--paper))}
.cfield.flash{animation:cfl 1.6s}@keyframes cfl{0%,60%{background:color-mix(in srgb,var(--ochre) 22%,transparent)}100%{background:transparent}}
.cfield .meta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:4px;font-size:11.5px;color:var(--muted)}
.cfield .meta a{color:var(--ochre);font-weight:700;cursor:pointer}
.cfield .tk{background:var(--sand);border-radius:6px;padding:1px 6px;font-family:ui-monospace,monospace}
.cgroup{margin-top:6px}.cgroup>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 4px;font:800 12px Inter,system-ui,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.cgroup>summary::-webkit-details-marker{display:none}.cgroup>summary .n{font-weight:700;letter-spacing:0;text-transform:none;font-size:12px}
.cgroup>summary .n b{color:var(--ochre)}
.csave{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--paper)}
.csave .st{flex:1;font-size:13px;color:var(--muted);min-width:150px}.csave .st.dirty{color:var(--warn);font-weight:700}
.cmode{display:none}
@media (max-width:980px){
  .cw{display:block;height:auto;min-height:0}
  .cmode{display:flex;gap:6px;margin:0 0 10px}.cmode button{flex:1;height:44px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font:700 14px Inter,system-ui,sans-serif;color:var(--muted)}.cmode button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .cpv,.ced{height:calc(100vh - var(--navh,64px) - 150px);min-height:460px}
  .cw[data-m="edit"] .cpv{display:none}.cw[data-m="view"] .ced{display:none}
}
</style>
</head>
<body>
<main id="content">
  <div class="cmode" id="cmode"><button data-m="edit" class="on">✏️ Edit text</button><button data-m="view">👁 Preview</button></div>
  <div class="cw" id="cw" data-m="edit">
    <section class="cpv" aria-label="Live preview">
      <div class="cbar"><b style="font-size:14px">Live preview</b><span class="sp"></span><select id="park" aria-label="Park" hidden></select><div class="dev" role="group" aria-label="Screen size"><button id="devD" class="on">Desktop</button><button id="devP">Phone</button></div><a class="btn sm" id="openPg" target="_blank" rel="noopener">Open ↗</a></div>
      <div class="cstage" id="stage"><iframe id="pv" title="Website preview"></iframe></div>
      <div class="chint">Tip: click any text in the preview to edit it. Changes show here instantly. Nothing goes live until you press Save.</div>
    </section>
    <section class="ced" aria-label="Edit text">
      <div class="ctabs" id="ctabs"></div>
      <div class="cform" id="cform"></div>
      <div class="csave"><span class="st" id="cst">No changes</span><button class="btn" id="discard" disabled>Undo changes</button><button class="btn primary" id="save" disabled>Save</button></div>
    </section>
  </div>
</main>

<script defer src="/api/admin/data.js"></script>
<script defer src="/assets/core.js"></script>
<script defer src="/assets/admin.js"></script>
<script defer src="/assets/pages/admin-content.js"></script>
</body>
</html>
