<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shared trips – Admin</title>
<meta name="theme-color" content="#2b2118">
<link rel="manifest" href="/admin.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yala Admin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
<link rel="stylesheet" href="/assets/admin.css">
<link rel="stylesheet" href="/assets/pwa.css">
<style>
.trips{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.trip{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left;width:100%}
.trip:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.trip .dt{font-family:Fraunces,serif;font-size:20px;font-weight:700}
.mini-seats{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:12px 0 6px}
.mini-seats i{height:22px;border-radius:6px;background:var(--sand);border:1px solid var(--line)}
.mini-seats i.p{background:var(--olive);border-color:var(--olive)}.mini-seats i.r{background:#d9a441;border-color:#d9a441}
.lnkbox{display:flex;gap:6px;align-items:center;background:var(--sand);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 10px}
.lnkbox code{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seatmap{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:linear-gradient(180deg,#6b7b45,#4e5c30);padding:40px 14px 14px;border-radius:24px 24px 14px 14px;position:relative}
.seatmap::before{content:"FRONT";position:absolute;top:12px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.7)}
.st{border-radius:10px;padding:8px;min-height:62px;border:2px dashed rgba(255,255,255,.5);color:#fff;font-size:12px;text-align:left;background:rgba(255,255,255,.08)}
.st b{display:block;font-size:13px}
.st.p{background:#2f6a3a;border:2px solid #a9d18e}.st.r{background:#c8742b;border:2px solid #f2b56b}
.newtrip-prev{border:1px dashed var(--ochre);border-radius:12px;padding:12px;margin-top:6px}
</style>
</head>
<body>
<main id="content">
  <div class="note" style="margin-bottom:14px">Shared trips are <b>not shown on the public site</b>. Create a trip, then send its private link to guests who ask (WhatsApp, email). It runs once <b>${SETTINGS.minSeats}</b> seats are paid. If it isn't, it auto-cancels ${SETTINGS.payWindowH}h before and refunds everyone.</div>
  <div class="toolbar" style="margin-bottom:12px"><div class="tabs2" id="tabs"></div></div>
  <div class="trips" id="trips"></div>
</main>

<script defer src="/api/admin/data.js"></script>
<script defer src="/assets/core.js"></script>
<script defer src="/assets/admin.js"></script>
<script defer src="/assets/qr.js"></script>
<script defer src="/assets/pages/admin-shared.js"></script>
</body>
</html>
