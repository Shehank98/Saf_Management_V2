<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settings – Admin</title>
<meta name="theme-color" content="#2b2118">
<link rel="manifest" href="/admin.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yala Admin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
<link rel="stylesheet" href="/assets/admin.css">
<link rel="stylesheet" href="/assets/pwa.css">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css"><style>
.setw{display:grid;grid-template-columns:210px 1fr;gap:16px;align-items:start}
@media (max-width:820px){.setw{grid-template-columns:1fr}.subnav{display:flex;overflow-x:auto;gap:4px;position:static!important}}
.subnav{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px}
.subnav button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.subnav button.on{background:var(--sand);color:var(--ink)}
.g2f{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){.g2f{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--muted);margin-top:-6px;margin-bottom:12px}
table.t td .inp{min-height:38px;padding:7px 10px}
.closed{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.closed span{background:var(--bad-bg);color:var(--bad);border-radius:99px;padding:4px 10px;font-size:13px;font-weight:700}
.closed span button{border:0;background:none;color:inherit;margin-left:4px;font-weight:800}
.savebar{position:sticky;bottom:0;margin-top:14px;padding:12px 0;background:linear-gradient(180deg,transparent,var(--paper) 30%);display:flex;justify-content:flex-end;gap:8px}
.ev{display:grid;grid-template-columns:1fr 70px 70px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev.h{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ev .switch{justify-self:center}
</style>
</head>
<body>
<main id="content">
  <div class="setw"><nav class="subnav" id="sub" aria-label="Settings sections"></nav><div><div class="panel"><div class="pb" id="pane"></div></div>
  <div class="savebar"><button class="btn" id="reset">Discard</button><button class="btn primary" id="save">Save changes</button></div></div></div>
</main>

<script defer src="/api/admin/data.js"></script>
<script defer src="/assets/core.js"></script>
<script defer src="/assets/admin.js"></script>
<script defer src="/vendor/leaflet/leaflet.js"></script>
<script defer src="/assets/map.js"></script>
<script defer src="/assets/pages/admin-settings.js"></script>
</body>
</html>
