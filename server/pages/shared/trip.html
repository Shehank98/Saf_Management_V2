<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book your seat</title>
<meta name="theme-color" content="#c0682a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yala Safaris">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
<link rel="stylesheet" href="/assets/customer.css">
<link rel="stylesheet" href="/assets/pwa.css">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<style>
main.wrap{padding:20px 16px 130px;max-width:1040px}
/* trip header */
.thead{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.thead .eb{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ochre)}
.thead h1{font-size:clamp(22px,3.4vw,30px);margin:4px 0 0}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.facts div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.facts b{display:block;font-size:15px;color:var(--ink);text-transform:none;letter-spacing:0;margin-top:2px}
@media (max-width:640px){.facts{grid-template-columns:1fr 1fr}}
.runs{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.meter{flex:1 1 220px;height:8px;border-radius:99px;background:var(--sand);display:flex;overflow:hidden;position:relative}
.meter span{height:100%;transition:width .4s}
/* stepper */
.stp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 16px;counter-reset:s}
.stp span{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);padding-top:9px;border-top:3px solid var(--line)}
.stp span::before{counter-increment:s;content:counter(s);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--sand);color:var(--muted);flex:none}
.stp span.on{color:var(--ink);border-color:var(--ochre)}.stp span.on::before{background:var(--ochre);color:var(--ochre-ink)}
.stp span.done{border-color:var(--olive)}.stp span.done::before{content:"✓";background:var(--olive);color:#fff}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
@media (min-width:821px){.side{position:sticky;top:76px}}
/* seat map */
.vehicle{position:relative;max-width:330px;margin:6px auto 0;border:2px solid var(--line);border-radius:46px 46px 22px 22px;background:var(--paper);padding:56px 22px 22px}
.vehicle::before{content:"FRONT";position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;letter-spacing:.24em;color:var(--muted)}
.vehicle .cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.vehicle .drv{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--muted)}
.vehicle .drv i{width:40px;height:40px;border-radius:10px;background:var(--sand);display:grid;place-items:center;font-style:normal}
.vehicle .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.vehicle .rl{grid-column:1/-1;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:-4px}
.seat{position:relative;height:64px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s,box-shadow .15s;font:inherit}
.seat b{font-size:18px;font-weight:800;line-height:1}
.seat small{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.seat:hover:not(:disabled){border-color:var(--olive);box-shadow:0 0 0 3px color-mix(in srgb,var(--olive) 18%,transparent)}
.seat:active:not(:disabled){transform:scale(.97)}
.seat:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.seat.mine{background:var(--leaf);border-color:var(--leaf);color:#fff}.seat.mine small{color:#e6f0da}
.seat.mine::after{content:"";position:absolute;top:7px;right:8px;width:7px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.seat.busy{opacity:.6;pointer-events:none}
.seat.lock{background:repeating-linear-gradient(135deg,var(--sand) 0 6px,var(--paper) 6px 12px);color:var(--muted);cursor:not-allowed}
.seat.taken{background:var(--sand);border-color:transparent;color:var(--muted);cursor:not-allowed}.seat.taken b{opacity:.45}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:14px;font-size:12px;color:var(--muted);font-weight:600}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);background:var(--card)}
.legend i.m{background:var(--leaf);border-color:var(--leaf)}.legend i.l{background:repeating-linear-gradient(135deg,var(--sand) 0 3px,var(--paper) 3px 6px)}.legend i.t{background:var(--sand);border-color:transparent}
.timer{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:9px 12px;border-radius:10px;background:var(--ok-bg);margin-top:12px}
.timer.low{background:var(--warn-bg)}.timer.out{background:var(--bad-bg)}
.timer b{font-variant-numeric:tabular-nums}
/* summary */
.sum h3{font-size:16px;margin-bottom:8px}
.sum .r{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.sum .r:last-of-type{border-bottom:0}.sum .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.sum .tot b{font-family:Fraunces,serif;font-size:22px}
/* details */
.phone{display:grid;grid-template-columns:100px 1fr;gap:8px}
.sec{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.sec h3{font-size:16px;margin-bottom:4px}
.mrow{display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:center;margin-top:8px}.mrow .inp{min-height:42px;padding:7px 10px}
.xrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.xrow:last-child{border-bottom:0}
.lmap{height:260px;border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-top:10px}
.msearch{position:relative;margin-top:10px}.mres{display:none;position:absolute;z-index:500;left:0;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:240px;overflow:auto}
.mres button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;font-size:13.5px;border-bottom:1px solid var(--line)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-top:12px}
.chk input{width:20px;height:20px;accent-color:var(--ochre);margin-top:2px;flex:none}
.bad-link{text-align:center;padding:50px 20px}
.how{padding-left:18px;margin:8px 0 0;line-height:1.75}
.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em}
.spin{width:38px;height:38px;margin:0 auto 12px;border-radius:50%;border:4px solid var(--sand);border-top-color:var(--ochre);animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="wrap" id="root"></main>
<div class="bbar" id="bar"><div class="row"><div><div class="lbl" id="bl">Your seats</div><div class="amt" id="ba">LKR 0</div></div><div style="display:flex;align-items:center"><button class="back lnk" id="bk" style="border:0">← Back</button><button class="btn primary" id="nx" disabled>Continue</button></div></div></div>

<script defer src="/api/config.js"></script>
<script defer src="/assets/core.js"></script>
<script defer src="/assets/customer.js"></script>
<script defer src="/vendor/leaflet/leaflet.js"></script>
<script defer src="/assets/map.js"></script>
<script defer src="/assets/pages/shared-trip.js"></script>
</body>
</html>
