<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shared safari – book your seat</title>
<meta name="theme-color" content="#c0682a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yala Safaris">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/customer.css">
<link rel="stylesheet" href="/assets/pwa.css">
<style>
main.wrap{padding:20px 16px 130px;max-width:920px}
.invite{position:relative;overflow:hidden;border-radius:20px;padding:22px;color:#2b160a;background:linear-gradient(120deg,#f7c77e,#f19a5a);box-shadow:var(--shadow)}
.invite .sun{position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:#ffe7a8;opacity:.7}
.invite .jp{position:absolute;right:20px;bottom:10px;animation:idle 1s ease-in-out infinite alternate}
@keyframes idle{to{transform:translateY(-3px)}}
.invite h1{font-size:clamp(24px,4vw,34px);position:relative}
.invite .eb{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;position:relative}
.facts{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;position:relative}
.facts div{font-size:12px}.facts b{display:block;font-size:16px}
.meter{height:14px;border-radius:99px;background:var(--sand);display:flex;overflow:hidden;position:relative;margin:10px 0}
.meter span{height:100%;transition:width .5s}
.meter .mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);left:66.66%}
.stp{display:flex;gap:6px;margin:18px 0 14px}
.stp span{flex:1;height:5px;border-radius:99px;background:var(--sand)}
.stp span.on{background:var(--ochre)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.jeep{max-width:320px;margin:0 auto;position:relative;background:linear-gradient(180deg,#6b7b45,#4e5c30);border-radius:40px 40px 22px 22px;padding:62px 22px 24px;box-shadow:var(--shadow)}
.jeep .ws{position:absolute;top:16px;left:26px;right:26px;height:24px;border-radius:10px;background:rgba(200,230,240,.45);font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.85);display:grid;place-items:center}
.rowl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.75);margin:10px 0 5px}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seat{height:70px;border-radius:14px;border:2px dashed rgba(255,255,255,.6);background:rgba(255,255,255,.12);color:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .2s}
.seat small{font-size:11px;font-weight:600}
.seat:hover:not(:disabled){transform:scale(1.04)}
.seat.mine{background:#f2b56b;border:2px solid #fff;color:#2b1a0e}
.seat:disabled{background:rgba(0,0,0,.28);border:2px solid transparent;color:rgba(255,255,255,.6);cursor:not-allowed}
.phone{display:grid;grid-template-columns:100px 1fr;gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-top:12px}
.chk input{width:20px;height:20px;accent-color:var(--ochre);margin-top:2px;flex:none}
.bad-link{text-align:center;padding:50px 20px}
.sec-m{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.mrow{display:grid;grid-template-columns:80px 1fr;gap:8px;align-items:center;margin-top:8px;animation:fade .3s both}.mrow .inp{min-height:40px;padding:7px 10px}
</style>
</head>
<body>
<main class="wrap" id="root"></main>
<div class="bbar" id="bar"><div class="row"><div><div class="lbl" id="bl">Your seats</div><div class="amt" id="ba">LKR 0</div></div><div style="display:flex;align-items:center"><button class="back lnk" id="bk" style="border:0">← Back</button><button class="btn primary" id="nx" disabled>Continue</button></div></div></div>

<script src="/api/config.js"></script>
<script src="/assets/core.js"></script>
<script src="/assets/customer.js"></script>
<script src="/assets/pages/shared-trip.js"></script>
</body>
</html>
