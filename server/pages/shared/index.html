<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choose your safari date</title>
<meta name="theme-color" content="#c0682a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yala Safaris">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
<link rel="stylesheet" href="/assets/customer.css">
<link rel="stylesheet" href="/assets/calendar.css">
<link rel="stylesheet" href="/assets/pwa.css">

</head>
<body>
<main class="wrap">
  <div style="max-width:860px;margin:0 auto;padding:64px 0 60px">
    <div class="head fade"><div class="dsteps"><b>1</b>Date<i></i><span class="d"><b style="background:var(--line);color:var(--muted)">2</b>Seats</span><i></i><span class="d"><b style="background:var(--line);color:var(--muted)">3</b>Pay</span></div><h1>Choose your date</h1><p>Join a shared jeep and split the cost. A shared jeep goes ahead once <span data-cfg="minSeats">4</span> seats are paid; if it doesn't, you get a full refund.</p></div>
    <div class="pickrow fade" style="margin:14px 0 12px"><div id="locWrap"><span class="small muted lbl">Park</span><div class="seg" id="locSeg"></div></div><div><span class="small muted lbl">Session</span><div class="seg" id="sesSeg"></div></div></div>
    <div class="card fade">
      <div class="calhead"><h3 id="mon"></h3><div class="nav"><button id="prev" aria-label="Previous month">‹</button><button id="nxt" aria-label="Next month">›</button></div></div>
      <div class="cal" id="cal"></div>
      <div class="legend2"><span><i class="on"></i>Safari is on</span><span><i></i>Seats free</span><span><i class="few"></i>Filling up</span><span><i class="full"></i>Full</span><span><i class="off"></i>Closed</span></div>
    </div>
    <div id="detail" style="margin-top:14px"></div>
    <p class="small muted" style="margin-top:18px" id="privLink" hidden>Want your own jeep instead? <a href="/book/session"><b>Book a private safari</b></a>.</p>
  </div>
</main>

<script defer src="/api/config.js"></script>
<script defer src="/assets/core.js"></script>
<script defer src="/assets/customer.js"></script>
<script defer src="/assets/fancy-select.js"></script>
<script defer src="/assets/pages/shared-index.js"></script>
</body>
</html>
