<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose your session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf6ea; --sand:#f3e8d0; --card:#fffdf7; --ink:#2b2118; --muted:#6f604f;
  --line:#e3d4b6; --ochre:#c0682a; --ochre-ink:#fff; --rust:#a64b2a; --olive:#5b6b3a; --leaf:#3f5a2e;
  --sky1:#f7c77e; --sky2:#f19a5a; --hill1:#d89a5b; --hill2:#b8743f; --hill3:#7a4a2a;
  --ok:#3a6f34; --warn:#93600f; --bad:#a63a2a; --info:#2f6a8a;
  --ok-bg:#e4efd9; --warn-bg:#f8e9c8; --bad-bg:#f6dcd4; --info-bg:#dbeaf1;
  --taken:#d9cdb4;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 10px 28px rgba(60,40,20,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#17130f; --sand:#221c16; --card:#262019; --ink:#f2e8d6; --muted:#b8a78f;
    --line:#3d3226; --ochre:#e0914e; --ochre-ink:#1b120a; --rust:#d27552; --olive:#9bb06e; --leaf:#a9c58a;
    --sky1:#5a3a4a; --sky2:#c86a3e; --hill1:#7a4a2c; --hill2:#55331f; --hill3:#2e1d12;
    --ok:#8fcf7f; --warn:#e8b55a; --bad:#ec8a73; --info:#7fbfe0;
    --ok-bg:#24321d; --warn-bg:#3a2e17; --bad-bg:#3d2019; --info-bg:#182c36; --taken:#4a3f33;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
    --paper:#17130f; --sand:#221c16; --card:#262019; --ink:#f2e8d6; --muted:#b8a78f;
    --line:#3d3226; --ochre:#e0914e; --ochre-ink:#1b120a; --rust:#d27552; --olive:#9bb06e; --leaf:#a9c58a;
    --sky1:#5a3a4a; --sky2:#c86a3e; --hill1:#7a4a2c; --hill2:#55331f; --hill3:#2e1d12;
    --ok:#8fcf7f; --warn:#e8b55a; --bad:#ec8a73; --info:#7fbfe0;
    --ok-bg:#24321d; --warn-bg:#3a2e17; --bad-bg:#3d2019; --info-bg:#182c36; --taken:#4a3f33;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0}
h1{font-size:clamp(28px,5vw,42px)}
h2{font-size:clamp(22px,3.5vw,30px)}
h3{font-size:18px}
p{margin:0 0 10px}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;justify-content:space-between;height:58px;gap:10px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:Fraunces,serif;font-weight:700;font-size:18px;white-space:nowrap}
.logo .mk{width:34px;height:34px;border-radius:10px;background:var(--ochre);display:grid;place-items:center}
.top .links{display:flex;gap:6px;align-items:center}
.lnk{font-size:13px;font-weight:600;text-decoration:none;padding:7px 10px;border-radius:9px;border:1px solid transparent;background:none}
.lnk:hover{border-color:var(--line);background:var(--card)}

/* stepper */
.stepper{padding:14px 0 6px}
.track{position:relative;height:6px;background:var(--sand);border-radius:99px;margin:22px 8px 8px}
.track .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--olive),var(--ochre));border-radius:99px;transition:width .8s cubic-bezier(.3,.7,.3,1)}
.track .car{position:absolute;top:-22px;width:38px;height:24px;transform:translateX(-50%);transition:left .8s cubic-bezier(.3,.7,.3,1)}
.track .car svg{animation:bump .5s ease-in-out infinite alternate}
@keyframes bump{to{transform:translateY(-2px)}}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:6px}
.steps a,.steps span{font-size:12px;font-weight:600;color:var(--muted);text-align:center;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps .done{color:var(--olive)} .steps .cur{color:var(--ink)}
.steps a:hover{text-decoration:underline}
@media (max-width:640px){.steps span:not(.cur),.steps a{font-size:0}.steps .cur{grid-column:1/-1;font-size:13px;grid-row:1}}

/* layout */
.shell{display:grid;grid-template-columns:1fr 330px;gap:22px;align-items:start;padding:18px 16px 130px}
@media (max-width:900px){.shell{grid-template-columns:1fr}.aside{display:none}}
.head{margin:6px 0 18px}
.head p{color:var(--muted);margin-top:6px;max-width:640px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.aside{position:sticky;top:76px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:99px;background:var(--sand);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.info{background:var(--info-bg);color:var(--info)}
.note{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--sand);border:1px solid var(--line)}
.note.ok{background:var(--ok-bg);border-color:transparent;color:var(--ink)}
.note.warn{background:var(--warn-bg);border-color:transparent}
.note.bad{background:var(--bad-bg);border-color:transparent}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:11px 18px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none;transition:transform .15s,box-shadow .15s,opacity .15s;min-height:46px}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.primary{background:var(--ochre);border-color:var(--ochre);color:var(--ochre-ink)}
.btn.dark{background:#2b1a0e;border-color:#2b1a0e;color:#fde9c8}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

/* option cards (radio) */
.opt{position:relative;display:block;text-align:left;width:100%;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:16px;transition:border-color .2s,transform .2s,box-shadow .2s}
.opt:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.opt.on{border-color:var(--ochre);box-shadow:0 0 0 4px color-mix(in srgb,var(--ochre) 18%,transparent)}
.opt .radio{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--paper)}
.opt.on .radio{border-color:var(--ochre);background:var(--ochre);box-shadow:inset 0 0 0 4px var(--paper)}
.opt.dis{opacity:.45;pointer-events:none}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600}
.inp{padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);min-height:46px;width:100%}
.inp:focus,.btn:focus-visible,.opt:focus-visible{outline:3px solid color-mix(in srgb,var(--ochre) 50%,transparent);outline-offset:1px}
.inp.err{border-color:var(--bad)}
.errmsg{font-size:12px;color:var(--bad);min-height:0}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.switch{position:relative;width:46px;height:26px;border-radius:99px;background:var(--line);border:0;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--olive)} .switch.on::after{left:23px}

/* summary */
.sum h3{margin-bottom:10px}
.sum .r{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.sum .r span:first-child{color:var(--muted)}
.sum .r b{text-align:right}
.sum .r a{font-size:12px;color:var(--ochre);margin-left:6px}
.sum .tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;font-weight:700}
.sum .tot b{font-family:Fraunces,serif;font-size:24px;color:var(--ochre)}

/* bottom bar */
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(40,25,10,.08)}
.bbar .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;max-width:1100px;margin:0 auto}
.bbar .lbl{font-size:12px;color:var(--muted)}
.bbar .amt{font-family:Fraunces,serif;font-size:22px;font-weight:700;white-space:nowrap}
.bbar .back{font-size:13px;font-weight:600;text-decoration:none;color:var(--muted);margin-right:8px}
.bbar .btn{min-width:150px;white-space:nowrap}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(20,12,4,.45);display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheet .card{width:100%;border-radius:20px 20px 0 0;max-height:80vh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}

/* proto menu */
.proto{position:relative}
.proto>button{border:1px dashed var(--ochre);background:transparent;border-radius:9px;padding:6px 9px;font-size:12px;font-weight:700;color:var(--ochre);white-space:nowrap}
.proto .menu{position:absolute;right:0;top:40px;z-index:70;width:230px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:none}
.proto.open .menu{display:block}
.proto .menu a{display:block;padding:8px 10px;border-radius:9px;text-decoration:none;font-size:13px}
.proto .menu a:hover,.proto .menu a.cur{background:var(--sand)}
.proto .menu .h{font-size:11px;color:var(--muted);padding:6px 10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media (max-width:480px){.logo{font-size:15px}.logo .mk{width:30px;height:30px}.top .links{gap:2px}.lnk{padding:6px 7px}}
@media (max-width:480px){.bbar .amt{font-size:18px}.bbar .btn{min-width:0!important;padding:11px 14px;font-size:14px}.bbar .back{font-size:0;margin-right:6px}.bbar .back::before{content:'←';font-size:20px}}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#2b1a0e;color:#fde9c8;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:200;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.qr svg{display:block;width:100%;height:auto}
@media print{.top,.bbar,.proto,.noprint{display:none!important}body{background:#fff}}
.tag.live{background:var(--info-bg);color:var(--info);position:relative;padding-left:20px}
.tag.live::before{content:"";position:absolute;left:8px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:currentColor;animation:livepulse 1.4s ease-out infinite}
@keyframes livepulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
/* ===== Motion layer ===== */
main,.content{animation:pageIn .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}}
.kpis>*,.grid>*,.trips>*,.pcards>*,.sess>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.kpis>*:nth-child(2),.grid>*:nth-child(2),.trips>*:nth-child(2),.pcards>*:nth-child(2){animation-delay:.06s}
.kpis>*:nth-child(3),.grid>*:nth-child(3),.trips>*:nth-child(3),.pcards>*:nth-child(3){animation-delay:.12s}
.kpis>*:nth-child(4),.grid>*:nth-child(4),.trips>*:nth-child(4),.pcards>*:nth-child(4){animation-delay:.18s}
.kpis>*:nth-child(n+5),.grid>*:nth-child(n+5),.trips>*:nth-child(n+5),.pcards>*:nth-child(n+5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}}
.btn{position:relative;overflow:hidden}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary::after,.btn.ok::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .6s}
.btn.primary:hover::after,.btn.ok:hover::after{left:120%}
.card,.panel,.kpi{transition:box-shadow .25s,transform .25s,border-color .25s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.toast{transition:opacity .3s,transform .45s cubic-bezier(.3,1.5,.5,1)}
.mote{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff3c9;box-shadow:0 0 10px 3px rgba(255,230,160,.6);opacity:0;animation:mote linear infinite;z-index:1;pointer-events:none}
@keyframes mote{0%{opacity:0;transform:translate(0,0)}15%{opacity:.9}85%{opacity:.7}100%{opacity:0;transform:translate(var(--dx),-140px)}}
.drawer.open .db>*{animation:fade .35s both}
.drawer.open .db>*:nth-child(2){animation-delay:.03s}.drawer.open .db>*:nth-child(3){animation-delay:.06s}.drawer.open .db>*:nth-child(n+4){animation-delay:.09s}
.lnk{white-space:nowrap}
@media (max-width:420px){.logo{font-size:14px;gap:7px}.logo .mk{width:28px;height:28px}.top .links .lnk{font-size:12px;padding:6px 5px}.proto>button{padding:5px 6px;font-size:11px}}

</style>

  const mealN=+b.meals?(Array.isArray(b.mealPrefs)&&b.mealPrefs.length?b.mealPrefs.filter(x=>x!=='No meal').length:n):0;
  const base=j*s.jeep,meals=mealN*EXTRAS.meals.price,bino=+b.bino?EXTRAS.bino.price:0,cam=+b.cam?EXTRAS.cam.price:0;
  return{n,jeeps:j,base,meals,mealN,bino,cam,total:base+meals+bino+cam};
}

function partnerCosts(t){ // t: {ses, jeeps, mealsN, cam, guide}

function allTrips(){

  if(typeof qrcode!=='function')return'<svg viewBox="0 0 10 10"><text x="1" y="5" font-size="2">QR</text></svg>';
  const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount();let r='';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))r+=`M${x+4} ${y+4}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n+8} ${n+8}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="${r}" fill="${dark}"/></svg>`;

  $('#next').disabled=!sel;if(sel)setP('ses',sel);refreshSummary(0);
  $('#tip').innerHTML=sel==='full'?'<b>Full day:</b> pack sunscreen and water. Add a meal pack in step 4.':'<b>Tip:</b> pickup is 30 minutes before the session starts. You set your pickup point in step 4.';
}
$$('.opt').forEach(o=>o.onclick=()=>{sel=o.dataset.v;paint()});
$('#next').onclick=()=>go('02-date.html',{ses:sel});
paint();
</script>
</body>
