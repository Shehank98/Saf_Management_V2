<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Private bookings – Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf6ea; --sand:#f3e8d0; --card:#fffdf7; --ink:#2b2118; --muted:#6f604f;
  --line:#e3d4b6; --ochre:#c0682a; --ochre-ink:#fff; --rust:#a64b2a; --olive:#5b6b3a; --leaf:#3f5a2e;
  --sky1:#f7c77e; --sky2:#f19a5a; --hill1:#d89a5b; --hill2:#b8743f; --hill3:#7a4a2a;
  --ok:#3a6f34; --warn:#93600f; --bad:#a63a2a; --info:#2f6a8a;
  --ok-bg:#e4efd9; --warn-bg:#f8e9c8; --bad-bg:#f6dcd4; --info-bg:#dbeaf1;
  --taken:#d9cdb4;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 10px 28px rgba(60,40,20,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#17130f; --sand:#221c16; --card:#262019; --ink:#f2e8d6; --muted:#b8a78f;
    --line:#3d3226; --ochre:#e0914e; --ochre-ink:#1b120a; --rust:#d27552; --olive:#9bb06e; --leaf:#a9c58a;
    --sky1:#5a3a4a; --sky2:#c86a3e; --hill1:#7a4a2c; --hill2:#55331f; --hill3:#2e1d12;
    --ok:#8fcf7f; --warn:#e8b55a; --bad:#ec8a73; --info:#7fbfe0;
    --ok-bg:#24321d; --warn-bg:#3a2e17; --bad-bg:#3d2019; --info-bg:#182c36; --taken:#4a3f33;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
    --paper:#17130f; --sand:#221c16; --card:#262019; --ink:#f2e8d6; --muted:#b8a78f;
    --line:#3d3226; --ochre:#e0914e; --ochre-ink:#1b120a; --rust:#d27552; --olive:#9bb06e; --leaf:#a9c58a;
    --sky1:#5a3a4a; --sky2:#c86a3e; --hill1:#7a4a2c; --hill2:#55331f; --hill3:#2e1d12;
    --ok:#8fcf7f; --warn:#e8b55a; --bad:#ec8a73; --info:#7fbfe0;
    --ok-bg:#24321d; --warn-bg:#3a2e17; --bad-bg:#3d2019; --info-bg:#182c36; --taken:#4a3f33;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0}
h1{font-size:clamp(28px,5vw,42px)}
h2{font-size:clamp(22px,3.5vw,30px)}
h3{font-size:18px}
p{margin:0 0 10px}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;justify-content:space-between;height:58px;gap:10px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:Fraunces,serif;font-weight:700;font-size:18px;white-space:nowrap}
.logo .mk{width:34px;height:34px;border-radius:10px;background:var(--ochre);display:grid;place-items:center}
.top .links{display:flex;gap:6px;align-items:center}
.lnk{font-size:13px;font-weight:600;text-decoration:none;padding:7px 10px;border-radius:9px;border:1px solid transparent;background:none}
.lnk:hover{border-color:var(--line);background:var(--card)}

/* stepper */
.stepper{padding:14px 0 6px}
.track{position:relative;height:6px;background:var(--sand);border-radius:99px;margin:22px 8px 8px}
.track .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--olive),var(--ochre));border-radius:99px;transition:width .8s cubic-bezier(.3,.7,.3,1)}
.track .car{position:absolute;top:-22px;width:38px;height:24px;transform:translateX(-50%);transition:left .8s cubic-bezier(.3,.7,.3,1)}
.track .car svg{animation:bump .5s ease-in-out infinite alternate}
@keyframes bump{to{transform:translateY(-2px)}}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:6px}
.steps a,.steps span{font-size:12px;font-weight:600;color:var(--muted);text-align:center;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps .done{color:var(--olive)} .steps .cur{color:var(--ink)}
.steps a:hover{text-decoration:underline}
@media (max-width:640px){.steps span:not(.cur),.steps a{font-size:0}.steps .cur{grid-column:1/-1;font-size:13px;grid-row:1}}

/* layout */
.shell{display:grid;grid-template-columns:1fr 330px;gap:22px;align-items:start;padding:18px 16px 130px}
@media (max-width:900px){.shell{grid-template-columns:1fr}.aside{display:none}}
.head{margin:6px 0 18px}
.head p{color:var(--muted);margin-top:6px;max-width:640px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.aside{position:sticky;top:76px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:99px;background:var(--sand);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.info{background:var(--info-bg);color:var(--info)}
.note{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--sand);border:1px solid var(--line)}
.note.ok{background:var(--ok-bg);border-color:transparent;color:var(--ink)}
.note.warn{background:var(--warn-bg);border-color:transparent}
.note.bad{background:var(--bad-bg);border-color:transparent}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:11px 18px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none;transition:transform .15s,box-shadow .15s,opacity .15s;min-height:46px}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.primary{background:var(--ochre);border-color:var(--ochre);color:var(--ochre-ink)}
.btn.dark{background:#2b1a0e;border-color:#2b1a0e;color:#fde9c8}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

/* option cards (radio) */
.opt{position:relative;display:block;text-align:left;width:100%;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:16px;transition:border-color .2s,transform .2s,box-shadow .2s}
.opt:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.opt.on{border-color:var(--ochre);box-shadow:0 0 0 4px color-mix(in srgb,var(--ochre) 18%,transparent)}
.opt .radio{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--paper)}
.opt.on .radio{border-color:var(--ochre);background:var(--ochre);box-shadow:inset 0 0 0 4px var(--paper)}
.opt.dis{opacity:.45;pointer-events:none}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600}
.inp{padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);min-height:46px;width:100%}
.inp:focus,.btn:focus-visible,.opt:focus-visible{outline:3px solid color-mix(in srgb,var(--ochre) 50%,transparent);outline-offset:1px}
.inp.err{border-color:var(--bad)}
.errmsg{font-size:12px;color:var(--bad);min-height:0}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.switch{position:relative;width:46px;height:26px;border-radius:99px;background:var(--line);border:0;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--olive)} .switch.on::after{left:23px}

/* summary */
.sum h3{margin-bottom:10px}
.sum .r{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.sum .r span:first-child{color:var(--muted)}
.sum .r b{text-align:right}
.sum .r a{font-size:12px;color:var(--ochre);margin-left:6px}
.sum .tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;font-weight:700}
.sum .tot b{font-family:Fraunces,serif;font-size:24px;color:var(--ochre)}

/* bottom bar */
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(40,25,10,.08)}
.bbar .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;max-width:1100px;margin:0 auto}
.bbar .lbl{font-size:12px;color:var(--muted)}
.bbar .amt{font-family:Fraunces,serif;font-size:22px;font-weight:700;white-space:nowrap}
.bbar .back{font-size:13px;font-weight:600;text-decoration:none;color:var(--muted);margin-right:8px}
.bbar .btn{min-width:150px;white-space:nowrap}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(20,12,4,.45);display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheet .card{width:100%;border-radius:20px 20px 0 0;max-height:80vh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}

/* proto menu */
.proto{position:relative}
.proto>button{border:1px dashed var(--ochre);background:transparent;border-radius:9px;padding:6px 9px;font-size:12px;font-weight:700;color:var(--ochre);white-space:nowrap}
.proto .menu{position:absolute;right:0;top:40px;z-index:70;width:230px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:none}
.proto.open .menu{display:block}
.proto .menu a{display:block;padding:8px 10px;border-radius:9px;text-decoration:none;font-size:13px}
.proto .menu a:hover,.proto .menu a.cur{background:var(--sand)}
.proto .menu .h{font-size:11px;color:var(--muted);padding:6px 10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media (max-width:480px){.logo{font-size:15px}.logo .mk{width:30px;height:30px}.top .links{gap:2px}.lnk{padding:6px 7px}}
@media (max-width:480px){.bbar .amt{font-size:18px}.bbar .btn{min-width:0!important;padding:11px 14px;font-size:14px}.bbar .back{font-size:0;margin-right:6px}.bbar .back::before{content:'←';font-size:20px}}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#2b1a0e;color:#fde9c8;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:200;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.qr svg{display:block;width:100%;height:auto}
@media print{.top,.bbar,.proto,.noprint{display:none!important}body{background:#fff}}
.tag.live{background:var(--info-bg);color:var(--info);position:relative;padding-left:20px}
.tag.live::before{content:"";position:absolute;left:8px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:currentColor;animation:livepulse 1.4s ease-out infinite}
@keyframes livepulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
/* ===== Motion layer ===== */
main,.content{animation:pageIn .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}}
.kpis>*,.grid>*,.trips>*,.pcards>*,.sess>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.kpis>*:nth-child(2),.grid>*:nth-child(2),.trips>*:nth-child(2),.pcards>*:nth-child(2){animation-delay:.06s}
.kpis>*:nth-child(3),.grid>*:nth-child(3),.trips>*:nth-child(3),.pcards>*:nth-child(3){animation-delay:.12s}
.kpis>*:nth-child(4),.grid>*:nth-child(4),.trips>*:nth-child(4),.pcards>*:nth-child(4){animation-delay:.18s}
.kpis>*:nth-child(n+5),.grid>*:nth-child(n+5),.trips>*:nth-child(n+5),.pcards>*:nth-child(n+5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}}
.btn{position:relative;overflow:hidden}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary::after,.btn.ok::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .6s}
.btn.primary:hover::after,.btn.ok:hover::after{left:120%}
.card,.panel,.kpi{transition:box-shadow .25s,transform .25s,border-color .25s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.toast{transition:opacity .3s,transform .45s cubic-bezier(.3,1.5,.5,1)}
.mote{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff3c9;box-shadow:0 0 10px 3px rgba(255,230,160,.6);opacity:0;animation:mote linear infinite;z-index:1;pointer-events:none}
@keyframes mote{0%{opacity:0;transform:translate(0,0)}15%{opacity:.9}85%{opacity:.7}100%{opacity:0;transform:translate(var(--dx),-140px)}}
.drawer.open .db>*{animation:fade .35s both}
.drawer.open .db>*:nth-child(2){animation-delay:.03s}.drawer.open .db>*:nth-child(3){animation-delay:.06s}.drawer.open .db>*:nth-child(n+4){animation-delay:.09s}
.lnk{white-space:nowrap}
@media (max-width:420px){.logo{font-size:14px;gap:7px}.logo .mk{width:28px;height:28px}.top .links .lnk{font-size:12px;padding:6px 5px}.proto>button{padding:5px 6px;font-size:11px}}

/* ===== Admin + vendor portal layout ===== */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:#231b14;color:#e8dcc4;padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.side .logo{color:#fff6e6;margin:2px 6px 18px}
.side .logo .mk{background:var(--ochre)}
.side a.nv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:600;color:#cdbfa5}
.side a.nv:hover{background:rgba(255,255,255,.06);color:#fff}
.side a.nv.on{background:var(--ochre);color:#1b120a}
.side a.nv .ct{margin-left:auto;background:#fde9c8;color:#2b1a0e;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:800}
.side .sep{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#8d7d64;padding:14px 12px 4px}
.side .me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-top:1px solid rgba(255,255,255,.08);font-size:13px}
.av{width:34px;height:34px;border-radius:50%;background:var(--olive);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.mainc{min-width:0}
.ahead{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 22px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.ahead h1{font-size:22px;flex:1}
.ahead .menu-btn{display:none;border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px}
.content{padding:20px 22px 60px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:80;transform:translateX(-100%);transition:transform .25s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
  .ahead .menu-btn{display:grid;place-items:center}
  .ahead{padding:10px 16px}.content{padding:16px 16px 60px}
}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-family:Fraunces,serif;font-size:28px;font-weight:700;margin-top:2px}
.kpi .d{font-size:12px;margin-top:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.panel .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel .ph h3{font-size:17px}
.panel .pb{padding:14px 16px}
.tblw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr{cursor:pointer;transition:background .15s}
table.t tbody tr:hover{background:var(--sand)}
.mono{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.03em}
.tabs2{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs2 button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.tabs2 button.on{background:var(--sand);color:var(--ink)}
.tabs2 button .c{font-size:11px;background:var(--line);border-radius:99px;padding:0 6px;margin-left:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{min-width:200px;flex:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--card);z-index:90;box-shadow:-20px 0 50px rgba(0,0,0,.2);transform:translateX(105%);transition:transform .3s cubic-bezier(.3,.7,.3,1);display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer .dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.drawer .db{padding:16px 18px;overflow:auto;flex:1}
.drawer .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.scrim{position:fixed;inset:0;background:rgba(20,12,4,.4);z-index:85;display:none}
.scrim.show{display:block}
.x{border:1px solid var(--line);background:var(--paper);border-radius:10px;width:36px;height:36px;font-size:18px;flex:none}
.dl{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:14px;margin-bottom:14px}
.dl dt{color:var(--muted)}.dl dd{margin:0;font-weight:600}
.sec-t{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.modal{position:fixed;inset:0;z-index:95;background:rgba(20,12,4,.5);display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal>.card{max-width:520px;width:100%;max-height:90vh;overflow:auto;animation:fade .25s ease}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--bad)}
.btn.ok{background:var(--olive);border-color:var(--olive);color:#fff}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.minimap{position:relative;height:120px;border-radius:10px;background:linear-gradient(135deg,#e6d6a8,#d8c08a);overflow:hidden}
.minimap .ring{position:absolute;left:50%;top:50%;width:100px;height:100px;transform:translate(-50%,-50%);border-radius:50%;border:2px dashed #3f5a2e}
.minimap .pin{position:absolute;width:14px;height:14px;border-radius:50%;background:#a64b2a;border:3px solid #fff;transform:translate(-50%,-50%)}
.minimap .base{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:#2b1a0e;transform:translate(-50%,-50%)}
@media (max-width:600px){.ahead h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.ahead .btn{white-space:nowrap;padding:7px 10px}.kpi .v{font-size:21px}.ahead .proto>button{padding:5px 7px}}
/* chart series tokens (validated: light #fcfcfb surface, dark #262019 surface) */
:root{--c-cost:#c46a2a;--c-profit:#1f6fa0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-cost:#d0773a;--c-profit:#3a9ad6}}
:root[data-theme="dark"]{--c-cost:#d0773a;--c-profit:#3a9ad6}
.scanres{border-radius:16px;padding:20px;animation:fade .3s}
.scanres.ok{background:var(--ok-bg)}.scanres.bad{background:var(--bad-bg)}.scanres.warn{background:var(--warn-bg)}
.scanres .big{font-family:Fraunces,serif;font-size:26px;font-weight:700}
.startanim{position:relative;height:56px;margin-bottom:8px;overflow:hidden}
.startanim .road2{position:absolute;left:0;right:30px;bottom:8px;border-top:3px dashed color-mix(in srgb,var(--ok) 50%,transparent)}
.startanim .flag{position:absolute;right:0;bottom:6px;font-size:24px;animation:wave 1s ease-in-out infinite alternate;transform-origin:bottom left}
@keyframes wave{to{transform:rotate(8deg)}}
.startanim .car2{position:absolute;bottom:10px;left:0;animation:go2 1.6s cubic-bezier(.4,.1,.3,1) forwards}
@keyframes go2{from{left:-70px}to{left:calc(100% - 110px)}}
.ticks{list-style:none;padding:0;margin:0;font-size:14px}
.ticks li{padding:3px 0 3px 24px;position:relative;opacity:0;animation:fade .4s forwards}
.ticks li::before{content:"✓";position:absolute;left:2px;color:var(--ok);font-weight:900}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kpi{padding:12px}.kpi .v{font-size:19px;word-break:break-word}.kpi .l{font-size:11.5px}.owed{font-size:24px!important}}
@media (max-width:600px){.hide-sm{display:none}}

function jeepsLeft(date,ses){
  const d=parseIso(date),days=Math.round((d-TODAY)/864e5),h=hash(date+'|'+ses);
  if(days<1)return{closed:true,reason:days<0?'Past':'Too soon'};
  if(h%29===0)return{closed:true,reason:'Park closed'};
  return{closed:false,jeeps:[0,1,2,3,3,4][(h>>>11)%6]};
}
const ppl=n=>n+(+n===1?' person':' people');
const jeepsFor=n=>Math.ceil(n/SETTINGS.maxPerJeep);
function calcBooking(b){
  const s=SESS[b.ses]||SESS.morning,n=Math.max(1,+b.guests||1),j=jeepsFor(n);
  const mealN=+b.meals?(Array.isArray(b.mealPrefs)&&b.mealPrefs.length?b.mealPrefs.filter(x=>x!=='No meal').length:n):0;
  const base=j*s.jeep,meals=mealN*EXTRAS.meals.price,bino=+b.bino?EXTRAS.bino.price:0,cam=+b.cam?EXTRAS.cam.price:0;
  return{n,jeeps:j,base,meals,mealN,bino,cam,total:base+meals+bino+cam};
}

function partnerCosts(t){ // t: {ses, jeeps, mealsN, cam, guide}
  const c=SETTINGS.costs,j=t.jeeps||1;
  const jeep=j*c.jeepFee[t.ses],guide=t.hasGuide===false?0:j*c.guideFee[t.ses],meals=(t.mealsN||0)*c.mealCost,cam=t.cam?c.camCost:0;

}

function qrSVG(text,dark='#2b1a0e'){
  if(typeof qrcode!=='function')return'<svg viewBox="0 0 10 10"><text x="1" y="5" font-size="2">QR</text></svg>';
  const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount();let r='';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))r+=`M${x+4} ${y+4}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n+8} ${n+8}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="${r}" fill="${dark}"/></svg>`;
}

 home:'<path d="M3 11l9-8 9 8v10H3z"/>',jobs:'<path d="M4 4h16v16H4zM8 9h8M8 13h8M8 17h5"/>',cal:'<path d="M3 5h18v16H3zM3 10h18M8 3v4M16 3v4"/>',money:'<circle cx="12" cy="12" r="9"/><path d="M15 9a3 3 0 0 0-3-1.5c-2 0-3 1-3 2.2 0 3 6 1.6 6 4.6 0 1.3-1.3 2.2-3 2.2a3.5 3.5 0 0 1-3.2-1.6M12 6v1.5M12 16.5V18"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'};
const ic=(k,sz=18)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;
const ADMIN_NAV=[['dashboard.html','Dashboard','dash'],['private.html','Private bookings','priv',()=>BOOKINGS.filter(b=>b.status==='Request').length],['shared.html','Shared trips','shared'],['payments.html','Payments &amp; profit','money',()=>new Set(payoutLines().filter(l=>!l.paid).map(l=>l.vendor)).size],['vendors.html','Vendors','vend',()=>APPLICATIONS.length],['checkin.html','Ticket check-in','scan'],['settings.html','Settings','set']];
function adminShell({active,title,actions='',nav=ADMIN_NAV,who=['SA','Shehan (Admin)'],sub='Admin'}){
  const content=$('#content');
  const side=`<nav class="side" id="side" aria-label="${sub} menu"><a class="logo" href="${nav[0][0]}"><span class="mk">${JEEP('#fff6e6',24,16)}</span>${BRAND}</a>
    <div class="sep">${sub}</div>${nav.map(([h,l,i,c])=>{const n=c?c():0;return `<a class="nv ${h===active?'on':''}" href="${h}">${ic(i)}${l}${n?`<span class="ct">${n}</span>`:''}</a>`}).join('')}
    ${sub==='Admin'?`<div class="sep">Preview</div><a class="nv" href="../emails/index.html">${ic('mail')}Email templates</a><a class="nv" href="../customer/index.html" target="_blank">${ic('home')}Customer site ↗</a>`:''}
    <div class="me"><span class="av">${who[0]}</span><div><b>${who[1]}</b><div class="tiny" style="color:#8d7d64"><a href="${sub==='Admin'?'login.html':'portal.html?logout=1'}" style="color:#cdbfa5">Log out</a></div></div></div></nav>`;
  const head=`<header class="ahead"><button class="menu-btn" id="mb" aria-label="Open menu">☰</button><h1>${title}</h1>${actions}${protoMenu()}<button class="lnk" data-theme-toggle aria-label="Switch theme">${THEME_ICON}</button></header>`;
  const wrap=document.createElement('div');wrap.className='app';wrap.innerHTML=side+`<div class="mainc">${head}</div>`;
  content.parentNode.insertBefore(wrap,content);wrap.querySelector('.mainc').appendChild(content);content.classList.add('content');
  $('#mb').onclick=e=>{e.stopPropagation();$('#side').classList.add('open')};document.addEventListener('click',e=>{const sd=$('#side');if(sd.classList.contains('open')&&!sd.contains(e.target))sd.classList.remove('open')});
  if(!$('#scrim'))document.body.insertAdjacentHTML('beforeend','<div class="scrim" id="scrim"></div><aside class="drawer" id="drawer" aria-modal="true" role="dialog"></aside><div class="modal" id="modal"><div class="card" id="modalBody"></div></div>');
  $('#scrim').onclick=closeDrawer;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeModal()}});
  wireChrome();
}
function openDrawer(html){$('#drawer').innerHTML=html;$('#drawer').classList.add('open');$('#scrim').classList.add('show');const x=$('#drawer .x');if(x){x.onclick=closeDrawer;x.focus()}}
function closeDrawer(){$('#drawer')?.classList.remove('open');$('#scrim')?.classList.remove('show')}
function openModal(html){$('#modalBody').innerHTML=html;$('#modal').classList.add('show');$$('#modalBody [data-close]').forEach(b=>b.onclick=closeModal)}
function closeModal(){$('#modal')?.classList.remove('show')}
const STATUS_CLS={Request:'warn','Deposit paid':'info',Started:'live',Confirmed:'ok',Completed:'',Cancelled:'bad',Open:'warn','Payment links sent':'info',Full:'info'};
const badge=s=>`<span class="tag ${STATUS_CLS[s]??''}">${s}</span>`;
const vendorOpts=(type,sel)=>`<option value="">— Not assigned —</option>`+VENDORS.filter(v=>v.status==='Active'&&(type==='jeep'?v.type==='Jeep + driver':v.type==='Tracker / guide')).map(v=>`<option value="${v.id}" ${v.id===sel?'selected':''}>${v.name}${v.plate?' · '+v.plate:''}</option>`).join('');

/* ===== Ticket scan = trip start (used by Admin → Check-in and the partner app) ===== */
const nowHM=()=>new Date().toTimeString().slice(0,5);
function scanTicket(code,{by='Office',force=false}={}){
  code=String(code||'').trim().toUpperCase();const b=BOOKINGS.find(x=>x.code===code);
  if(!b)return{kind:'bad',title:'✕ Not found',msg:`No ticket with code <b>${esc(code)}</b>. Check the code, or the QR may not be ours.`};
  if(b.status==='Cancelled')return{kind:'bad',title:'✕ Cancelled',msg:`${b.code} · ${esc(b.name)} was cancelled. Don't board.`};
  if(b.status==='Request')return{kind:'bad',title:'! Not confirmed yet',msg:`${b.code} is still a request. The office must confirm it first.`};
  if(b.status==='Completed')return{kind:'bad',title:'! Already completed',msg:`This safari finished on ${shortDate(b.date)}.`};
  if(b.status==='Started')return{kind:'warn',title:'Already started',msg:`${b.code} started at <b>${b.startedAt}</b>. Nothing else to do.`,b};
  if(b.date!==D(0)&&!force)return{kind:'warn',title:'! Different day',msg:`This ticket is for <b>${nice(b.date)}</b> (${SESS[b.ses].short}).`,b,canForce:true};
  b.status='Started';b.startedAt=nowHM();b.startedBy=by;
  return{kind:'ok',title:'Trip started',b};
}
function scanResultHTML(r){
  if(r.kind!=='ok')return `<div class="scanres ${r.kind}"><div class="big">${r.title}</div><p>${r.msg}</p>${r.canForce?'<button class="btn sm" id="force">Start anyway</button>':''}</div>`;
  const b=r.b,c=calcBooking(b),bal=c.total-b.paid,meal=mealSummary(b);
  return `<div class="scanres ok"><div class="startanim" aria-hidden="true"><div class="road2"></div><div class="flag">🏁</div><div class="car2">${JEEP('#3f5a2e',64,40)}</div></div>
  <div class="big">✓ Trip started · ${b.startedAt}</div><p style="font-size:17px;margin:4px 0 8px"><b>${esc(b.name)}</b> · ${ppl(c.n)} · ${SESS[b.ses].name}</p>
  <ul class="ticks"><li style="animation-delay:.5s">Email sent to ${esc(b.email)}: “Your safari has started”</li><li style="animation-delay:.8s">Office dashboard updated (live trips)</li><li style="animation-delay:1.1s">Partner payout lines created</li></ul>
  ${meal?`<p class="small" style="margin:8px 0 0"><b>Meals:</b> ${meal}</p>`:''}
  <p style="margin:10px 0 0">Collect from guest: <b style="color:${bal?'var(--bad)':'var(--ok)'}">${bal?fmt(bal):'nothing, fully paid'}</b></p>${bal?'<button class="btn sm ok" id="coll" style="margin-top:8px">Mark balance collected</button>':''}</div>`;
}
function wireScanResult(r,rerun){const f=$('#force');if(f)f.onclick=()=>rerun(true);const cl=$('#coll');if(cl)cl.onclick=()=>{r.b.paid=calcBooking(r.b).total;toast('Balance recorded');cl.remove()};if(r.kind==='ok')toast(`Trip started · email sent to ${esc(r.b.name.split(' ')[0])}`)}
</script>
</head>
<body>
<style>
.log{list-style:none;padding:0;margin:0;font-size:13px}
.log li{padding:6px 0 6px 18px;position:relative;border-left:2px solid var(--line);margin-left:4px}
.log li::before{content:"";position:absolute;left:-6px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--olive)}
.log li span{color:var(--muted);font-size:12px;margin-left:6px}
.payrow{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
.cards-m{display:none}
@media (max-width:700px){.tblw{display:none}.cards-m{display:grid;gap:10px}}
.mcard{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);cursor:pointer}
</style>
<main id="content">
  <div class="panel">
    <div class="ph"><div class="tabs2" id="tabs"></div><div class="toolbar"><input class="inp search" id="q" placeholder="Search name, code, phone…" style="min-height:38px;padding:8px 12px"><select class="inp" id="ses" style="min-height:38px;padding:6px 10px;width:auto"><option value="">All sessions</option></select></div></div>
    <div class="tblw"><table class="t"><thead><tr><th>Code</th><th>Guest</th><th>Safari</th><th>People</th><th>Payment</th><th>Jeep</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
    <div class="cards-m pb" id="mrows"></div>
  </div>
</main>
<script>
adminShell({active:'private.html',title:'Private bookings',actions:`<button class="btn sm primary" id="newBtn">+ New<span class="hide-sm"> booking</span></button>`});
const LOG={};BOOKINGS.forEach(b=>LOG[b.code]=[[b.created,'Booking created online'],[b.created,'Email sent to customer and to you']].concat(['Confirmed','Started'].includes(b.status)?[[b.created,'Confirmed · e-ticket emailed']]:[]).concat(b.vendor?[[b.created,'Assigned to '+vendorName(b.vendor)]]:[]).concat(b.status==='Started'?[[D(0),`Trip started ${b.startedAt} (ticket scanned) · “safari started” email sent`]]:[]));
let tab='all';
const TABS=[['all','All',()=>true],['req','Requests',b=>b.status==='Request'],['live','In progress',b=>b.status==='Started'],['up','Upcoming',b=>['Confirmed','Deposit paid'].includes(b.status)&&parseIso(b.date)>=TODAY],['done','Completed',b=>b.status==='Completed'],['cx','Cancelled',b=>b.status==='Cancelled']];
$('#ses').innerHTML+=Object.entries(SESS).map(([k,s])=>`<option value="${k}">${s.short}</option>`).join('');
function list(){
  const q=$('#q').value.toLowerCase(),sf=$('#ses').value,f=TABS.find(t=>t[0]===tab)[2];
  $('#tabs').innerHTML=TABS.map(([k,l,fn])=>`<button data-k="${k}" class="${k===tab?'on':''}">${l}<span class="c">${BOOKINGS.filter(fn).length}</span></button>`).join('');
  $$('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;list()});
  const rows=BOOKINGS.filter(f).filter(b=>!sf||b.ses===sf).filter(b=>(b.code+b.name+b.phone+b.email).toLowerCase().includes(q)).sort((a,b)=>a.date.localeCompare(b.date));
  $('#rows').innerHTML=rows.map(b=>{const c=calcBooking(b);return `<tr data-c="${b.code}"><td class="mono">${b.code}</td><td><b>${esc(b.name)}</b><div class="tiny muted">${esc(b.cc)} ${esc(b.phone)}</div></td><td>${shortDate(b.date)}<div class="tiny muted">${SESS[b.ses].short} · ${SESS[b.ses].pickup}</div></td><td>${b.guests}</td><td>${fmt(b.paid)}<div class="tiny muted">of ${fmt(c.total)}</div></td><td>${b.vendor?esc(vendorName(b.vendor)):'<span class="tiny" style="color:var(--bad)">Not assigned</span>'}</td><td>${badge(b.status)}</td></tr>`}).join('')||'<tr><td colspan="7" class="empty">No bookings match</td></tr>';
  $('#mrows').innerHTML=rows.map(b=>`<div class="mcard" data-c="${b.code}"><div style="display:flex;justify-content:space-between"><b class="mono">${b.code}</b>${badge(b.status)}</div><div>${esc(b.name)} · ${ppl(b.guests)}</div><div class="small muted">${shortDate(b.date)} · ${SESS[b.ses].short}</div></div>`).join('');
  $$('[data-c]').forEach(r=>r.onclick=()=>open(r.dataset.c));
}
function open(code){
  const b=BOOKINGS.find(x=>x.code===code);if(!b)return;const s=SESS[b.ses],c=calcBooking(b),bal=c.total-b.paid;
  const when=parseIso(b.date);const [hh,mm]=s.start.split(':');when.setHours(+hh,+mm);const hrs=(when-new Date())/36e5;
  const ext=[b.meals?'Meal pack ('+ppl(c.n)+')':'',b.bino?'Binoculars':'',b.cam?'Camera':''].filter(Boolean).join(', ')||'None';
  let main='';
  if(b.status==='Request')main=`<button class="btn ok" id="aConfirm">Confirm &amp; email ticket</button><button class="btn" id="aDecline">Decline</button>`;
  else if(b.status==='Started')main=`<button class="btn ok" id="aDone">Mark completed</button><button class="btn" id="aPay">Record payment</button>`;
  else if(['Confirmed','Deposit paid'].includes(b.status))main=`<button class="btn" id="aTicket">Resend e-ticket</button><button class="btn" id="aPay">Record payment</button>${hrs<0?'<button class="btn ok" id="aDone">Mark completed</button>':''}<button class="btn danger" id="aCancel">Cancel</button>`;
  openDrawer(`<div class="dh"><div><div class="mono" style="font-size:20px">${b.code}</div><div style="margin-top:4px">${badge(b.status)} <span class="small muted">booked ${shortDate(b.created)}</span></div></div><button class="x" aria-label="Close">×</button></div>
  <div class="db">
    <div class="sec-t">Guest</div><dl class="dl"><dt>Name</dt><dd>${esc(b.name)}</dd><dt>Mobile</dt><dd><a href="tel:${(b.cc+b.phone).replace(/\s/g,'')}">${esc(b.cc)} ${esc(b.phone)}</a></dd><dt>Email</dt><dd>${esc(b.email)}</dd><dt>Notes</dt><dd>${esc(b.notes)||'—'}</dd></dl>
    <div class="sec-t">Safari</div><dl class="dl"><dt>When</dt><dd>${nice(b.date)} · ${s.name}</dd><dt>Pickup</dt><dd>${s.pickup} · ${b.pmode==='hotel'?esc(b.hotel)+` (${b.pdist} km)`:'Office'}</dd><dt>Group</dt><dd>${ppl(c.n)} · ${c.jeeps} jeep${c.jeeps>1?'s':''}</dd><dt>Extras</dt><dd>${ext}</dd>${+b.meals?`<dt>Meal choices</dt><dd>${mealSummary(b)}</dd>`:''}${b.status==='Started'?`<dt>Trip started</dt><dd style="color:var(--info)">${b.startedAt} · scanned by ${esc(b.startedBy||vendorName(b.vendor)||'driver')}</dd>`:''}</dl>
    ${b.pmode==='hotel'?`<div class="minimap"><div class="ring"></div><div class="base"></div><div class="pin" style="left:${50+b.pdist*5}%;top:${50-b.pdist*3}%"></div></div>`:''}
    <div class="sec-t">Assign</div>
    <div class="field"><label for="vJ">Jeep + driver</label><select class="inp" id="vJ">${vendorOpts('jeep',b.vendor)}</select></div>
    <div class="field"><label for="vG">Tracker / guide</label><select class="inp" id="vG">${vendorOpts('guide',b.guide)}</select></div>
    <div class="sec-t">Payment</div>
    <div class="payrow"><span>Total</span><b>${fmt(c.total)}</b></div><div class="payrow"><span>Paid online</span><b style="color:var(--ok)">${fmt(b.paid)}</b></div><div class="payrow"><span>Collect at pickup</span><b>${fmt(bal)}</b></div>
    ${ACTIVE_STATUSES.includes(b.status)?`<div class="sec-t">E-ticket</div><div style="display:flex;gap:12px;align-items:center"><div class="qr" style="width:90px;border:1px solid var(--line);border-radius:8px;overflow:hidden">${qrSVG(ticketUrl(b.code))}</div><a class="small" href="../customer/ticket.html?code=${b.code}" target="_blank">Open ticket ↗</a></div>`:''}
    <div class="sec-t">Activity</div><ul class="log">${LOG[b.code].map(([d,t])=>`<li>${t}<span>${shortDate(d)}</span></li>`).join('')}</ul>
  </div><div class="df">${main}</div>`);
  const sv=()=>{b.vendor=$('#vJ').value;b.guide=$('#vG').value;LOG[b.code].push([D(0),'Assigned '+[vendorName(b.vendor),vendorName(b.guide)].filter(Boolean).join(' + ')]);toast('Saved · partner notified by email');list()};
  $('#vJ').onchange=sv;$('#vG').onchange=sv;
  const on=(id,fn)=>{const e=$('#'+id);if(e)e.onclick=fn};
  on('aConfirm',()=>{b.status='Confirmed';LOG[b.code].push([D(0),'Confirmed · e-ticket emailed']);toast(`Confirmed · ticket emailed to ${esc(b.email)}`);list();open(code)});
  on('aDecline',()=>openModal(`<h3>Decline ${b.code}?</h3><div class="field" style="margin-top:12px"><label for="why">Message to guest</label><textarea class="inp" id="why" rows="3">Sorry, we're fully booked for that session. Could another date work?</textarea></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-close>Back</button><button class="btn" id="dOk" style="background:var(--bad);border-color:var(--bad);color:#fff">Decline &amp; email</button></div>`)||($('#dOk').onclick=()=>{b.status='Cancelled';LOG[b.code].push([D(0),'Declined · guest emailed']);closeModal();toast('Declined. Guest emailed.');list();open(code)}));
  on('aTicket',()=>toast(`E-ticket re-sent to ${esc(b.email)}`));
  on('aDone',()=>{b.status='Completed';LOG[b.code].push([D(0),'Completed · thank-you email sent']);toast('Marked completed');list();open(code)});
  on('aPay',()=>{openModal(`<h3>Record a payment</h3><p class="small muted">Cash or card taken by the driver or at the office.</p><div class="field"><label for="amt">Amount (LKR)</label><input class="inp" id="amt" type="number" value="${bal}"></div><div class="field"><label for="mth">Method</label><select class="inp" id="mth"><option>Cash</option><option>Card at office</option><option>Bank transfer</option></select></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="pOk">Save</button></div>`);
    $('#pOk').onclick=()=>{const a=+$('#amt').value||0;b.paid+=a;if(b.status==='Deposit paid'&&b.paid>=c.total)b.status='Confirmed';LOG[b.code].push([D(0),`${fmt(a)} received (${$('#mth').value})`]);closeModal();toast('Payment recorded');list();open(code)}});
  on('aCancel',()=>{const rp=refundPct(hrs),ref=Math.round(b.paid*rp/100);openModal(`<h3>Cancel ${b.code}?</h3><p class="muted" style="margin:8px 0">${Math.round(hrs)}h before the safari → policy refund <b>${rp}%</b>.</p><div class="field"><label for="ref">Refund amount (LKR)</label><input class="inp" id="ref" type="number" value="${ref}"></div><p class="tiny muted">You can override the policy. The refund goes back through the payment gateway.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-close>Back</button><button class="btn" id="cOk" style="background:var(--bad);border-color:var(--bad);color:#fff">Cancel &amp; refund</button></div>`);
    $('#cOk').onclick=()=>{b.status='Cancelled';LOG[b.code].push([D(0),`Cancelled · ${fmt(+$('#ref').value)} refunded`]);closeModal();toast('Cancelled. Guest emailed.');list();open(code)}});
}
$('#q').oninput=list;$('#ses').onchange=list;
$('#newBtn').onclick=newBooking;
function newBooking(){
  openModal(`<h3>New booking (phone / walk-in)</h3><p class="small muted">For bookings taken by phone, email or at the office.</p>
  <div class="field"><label for="nn">Guest name</label><input class="inp" id="nn"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="field"><label for="np">Phone</label><input class="inp" id="np"></div><div class="field"><label for="ne">Email</label><input class="inp" id="ne" type="email"></div>
  <div class="field"><label for="nd">Date</label><input class="inp" id="nd" type="date" value="${D(3)}"></div><div class="field"><label for="ns">Session</label><select class="inp" id="ns">${Object.entries(SESS).map(([k,s])=>`<option value="${k}">${s.short}</option>`).join('')}</select></div>
  <div class="field"><label for="ng">People</label><input class="inp" id="ng" type="number" min="1" max="24" value="2"></div><div class="field"><label for="nst">Status</label><select class="inp" id="nst"><option>Confirmed</option><option>Request</option></select></div></div>
  <label class="small" style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><input type="checkbox" id="nmail" checked> Email the e-ticket to the guest</label>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="nOk">Create booking</button></div>`);
  $('#nOk').onclick=()=>{if(!$('#nn').value.trim()){$('#nn').classList.add('err');return}const code='YWS-'+(1000+hash(Date.now())%9000)+'P';
    BOOKINGS.unshift({code,name:$('#nn').value.trim(),cc:'',phone:$('#np').value,email:$('#ne').value,ses:$('#ns').value,date:$('#nd').value,guests:+$('#ng').value||1,pmode:'office',hotel:'',pdist:0,meals:0,bino:0,cam:0,pay:'later',paid:0,status:$('#nst').value,vendor:'',guide:'',created:D(0),notes:'Phone booking'});
    LOG[code]=[[D(0),'Created by admin (phone booking)']];closeModal();tab='all';list();toast(`Booking ${code} created`+($('#nmail')?.checked?' · ticket emailed':''));open(code)};
}
list();
if(P.get('open'))open(P.get('open'));if(P.get('new'))newBooking();
</script>
